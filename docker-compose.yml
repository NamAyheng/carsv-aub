# CarSV — Docker Compose (Windows + Linux)
#
# Uses container name `carsv-db` and host port 5433 so it does NOT conflict
# with a local test container named `postgres-db` on 127.0.0.1:5432.
#
# Quick start:
#   cp .env.example .env
#   docker compose up --build
#
# Frontend: http://localhost:3000
# API/Admin: http://localhost:8000/admin/

services:
  db:
    image: postgres:17
    container_name: carsv-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carsv}
      POSTGRES_USER: ${POSTGRES_USER:-carsv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carsv_change_me}
    volumes:
      - carsv_pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost only; different port from postgres-db test container.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carsv} -d ${POSTGRES_DB:-carsv}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./api-backend
      dockerfile: Dockerfile
    container_name: carsv-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-carsv}
      POSTGRES_USER: ${POSTGRES_USER:-carsv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carsv_change_me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost,api,carsv-api}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      DJANGO_CORS_ORIGINS: ${DJANGO_CORS_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      # Use the host api-backend/media folder (via ./api-backend:/app bind mount).
      DJANGO_MEDIA_ROOT: /app/media
    volumes:
      # Bind the whole backend so local media/ files are visible in the container.
      # Do NOT use a separate empty named volume for /app/media (it hid the files).
      - ./api-backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
    container_name: carsv-web
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://api:8000
      DISABLE_HMR: ${DISABLE_HMR:-false}
    volumes:
      - ./web-frontend:/app
      - carsv_web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  carsv_pgdata:
  carsv_web_node_modules:
